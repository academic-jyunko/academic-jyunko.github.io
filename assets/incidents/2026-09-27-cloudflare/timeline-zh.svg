<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1300" role="img" aria-labelledby="title desc" lang="zh">
<title id="title">从审计记录恢复时间线</title><desc id="desc">事件按时间排序，间距不代表真实时间长度。</desc>
<defs><marker id="arrow-cyan" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#22d3ee"/></marker><marker id="arrow-rose" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#fb7185"/></marker><marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#34d399"/></marker><marker id="arrow-amber" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#fbbf24"/></marker><marker id="arrow-slate" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#94a3b8"/></marker><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width=".6"/></pattern></defs>
<style>text{font-family:'PingFang SC','Noto Sans CJK SC','Noto Sans SC',Arial,sans-serif} .mono{font-family:'SFMono-Regular',Consolas,monospace}</style>
<rect width="960" height="1300" rx="16" fill="#0f172a"/><rect width="960" height="1300" rx="16" fill="url(#grid)"/>
<text x="40" y="43" font-size="15" fill="#22d3ee" text-anchor="start" font-weight="600">CORTEX / 24–27 SEP 2026</text><text x="40" y="93" font-size="34" fill="#e2e8f0" text-anchor="start" font-weight="700">从审计记录恢复时间线</text><text x="40" y="130" font-size="19" fill="#94a3b8" text-anchor="start" font-weight="400">全部时间：Asia/Shanghai (UTC+8) · 间距不代表时长</text><line x1="82" y1="206" x2="82" y2="1116" stroke="#334155" stroke-width="3"/><circle cx="82" cy="206" r="9" fill="#fbbf24" stroke="#0f172a" stroke-width="4"/><text x="119" y="212" font-size="19" fill="#fbbf24" text-anchor="start" font-weight="600">09/24 16:19</text><text x="119" y="249" font-size="26" fill="#e2e8f0" text-anchor="start" font-weight="600">账户令牌创建</text><text x="119" y="282" font-size="20" fill="#94a3b8" text-anchor="start" font-weight="400">控制台上下文；创建者会话如何获得，仍未知。</text><circle cx="82" cy="336" r="9" fill="#fb7185" stroke="#0f172a" stroke-width="4"/><text x="119" y="342" font-size="19" fill="#fb7185" text-anchor="start" font-weight="600">09/25 01:39</text><text x="119" y="379" font-size="26" fill="#e2e8f0" text-anchor="start" font-weight="600">较早的一次 Worker 注入部署</text><text x="119" y="412" font-size="20" fill="#94a3b8" text-anchor="start" font-weight="400">同一令牌随后还删除过路由及该 Worker。</text><circle cx="82" cy="466" r="9" fill="#fb7185" stroke="#0f172a" stroke-width="4"/><text x="119" y="472" font-size="19" fill="#fb7185" text-anchor="start" font-weight="600">09/26 01:29–01:30</text><text x="119" y="509" font-size="26" fill="#e2e8f0" text-anchor="start" font-weight="600">10 个业务 Worker 被删除</text><text x="119" y="542" font-size="20" fill="#94a3b8" text-anchor="start" font-weight="400">审计记录将这些删除操作关联到同一令牌。</text><circle cx="82" cy="596" r="9" fill="#fbbf24" stroke="#0f172a" stroke-width="4"/><text x="119" y="602" font-size="19" fill="#fbbf24" text-anchor="start" font-weight="600">09/27 09:00</text><text x="119" y="639" font-size="26" fill="#e2e8f0" text-anchor="start" font-weight="600">Cortex 构建失败</text><text x="119" y="672" font-size="20" fill="#94a3b8" text-anchor="start" font-weight="400">pnpm 补丁锁配置不一致，成为此次排查的起点。</text><circle cx="82" cy="726" r="9" fill="#fb7185" stroke="#0f172a" stroke-width="4"/><text x="119" y="732" font-size="19" fill="#fb7185" text-anchor="start" font-weight="600">09/27 11:00</text><text x="119" y="769" font-size="26" fill="#e2e8f0" text-anchor="start" font-weight="600">恶意 Worker 和全站路由再现</text><text x="119" y="802" font-size="20" fill="#94a3b8" text-anchor="start" font-weight="400">随后还发生 ssl、ipv6 设置编辑。</text><circle cx="82" cy="856" r="9" fill="#34d399" stroke="#0f172a" stroke-width="4"/><text x="119" y="862" font-size="19" fill="#34d399" text-anchor="start" font-weight="600">09/27 11:29</text><text x="119" y="899" font-size="26" fill="#e2e8f0" text-anchor="start" font-weight="600">先阻断响应注入</text><text x="119" y="932" font-size="20" fill="#94a3b8" text-anchor="start" font-weight="400">保全源码后，将该 Worker 替换为透传实现。</text><circle cx="82" cy="986" r="9" fill="#34d399" stroke="#0f172a" stroke-width="4"/><text x="119" y="992" font-size="19" fill="#34d399" text-anchor="start" font-weight="600">09/27 11:45–11:51</text><text x="119" y="1029" font-size="26" fill="#e2e8f0" text-anchor="start" font-weight="600">撤销令牌，删除恶意 Worker</text><text x="119" y="1062" font-size="20" fill="#94a3b8" text-anchor="start" font-weight="400">令牌删除由审计确认；Worker 删除由 API 确认。</text><circle cx="82" cy="1116" r="9" fill="#34d399" stroke="#0f172a" stroke-width="4"/><text x="119" y="1122" font-size="19" fill="#34d399" text-anchor="start" font-weight="600">09/27 12:06–12:07</text><text x="119" y="1159" font-size="26" fill="#e2e8f0" text-anchor="start" font-weight="600">域名设置收尾</text><text x="119" y="1192" font-size="20" fill="#94a3b8" text-anchor="start" font-weight="400">管理员开启 IPv6，并将 SSL 模式设为 Full。</text><text x="40" y="1260" font-size="18" fill="#94a3b8" text-anchor="start" font-weight="400">来源：私有审计摘录、部署回执与管理员确认。</text></svg>