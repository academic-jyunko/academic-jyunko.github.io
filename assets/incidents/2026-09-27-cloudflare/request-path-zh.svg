<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 820" role="img" aria-labelledby="title desc" lang="zh">
<title id="title">HTML 是在哪一层被改写的？</title><desc id="desc">浏览器的请求先匹配恶意路由 Worker。它向 Cortex Worker 获取应用 HTML，再追加脚本并返回。</desc>
<defs><marker id="arrow-cyan" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#22d3ee"/></marker><marker id="arrow-rose" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#fb7185"/></marker><marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#34d399"/></marker><marker id="arrow-amber" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#fbbf24"/></marker><marker id="arrow-slate" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#94a3b8"/></marker><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width=".6"/></pattern></defs>
<style>text{font-family:'PingFang SC','Noto Sans CJK SC','Noto Sans SC',Arial,sans-serif} .mono{font-family:'SFMono-Regular',Consolas,monospace}</style>
<rect width="960" height="820" rx="16" fill="#0f172a"/><rect width="960" height="820" rx="16" fill="url(#grid)"/>
<text x="40" y="43" font-size="15" fill="#22d3ee" text-anchor="start" font-weight="600">CORTEX / INCIDENT RECONSTRUCTION</text><text x="40" y="93" font-size="34" fill="#e2e8f0" text-anchor="start" font-weight="700">HTML 是在哪一层被改写的？</text><text x="40" y="127" font-size="18" fill="#94a3b8" text-anchor="start" font-weight="400">按保存的源码与路由重建；图示不代表完整流量日志</text><rect x="332" y="155" width="593" height="555" rx="15" fill="none" stroke="#fbbf24" stroke-dasharray="8 6"/><text x="353" y="179" font-size="16" fill="#fbbf24" text-anchor="start" font-weight="400">Cloudflare</text><line x1="165" y1="277" x2="165" y2="694" stroke="#475569" stroke-dasharray="6 6"/><line x1="480" y1="277" x2="480" y2="694" stroke="#475569" stroke-dasharray="6 6"/><line x1="790" y1="277" x2="790" y2="694" stroke="#475569" stroke-dasharray="6 6"/><line x1="165" y1="322" x2="476" y2="322" stroke="#22d3ee" stroke-width="2.2" marker-end="url(#arrow-cyan)"/><rect x="257.5" y="284" width="126" height="30" fill="#0f172a"/><text x="320.5" y="307" font-size="20" fill="#22d3ee" text-anchor="middle" font-weight="400">HTTPS 请求</text><line x1="484" y1="405" x2="786" y2="405" stroke="#fbbf24" stroke-width="2.2" marker-end="url(#arrow-amber)"/><rect x="548.0" y="367" width="174" height="30" fill="#0f172a"/><text x="635.0" y="390" font-size="20" fill="#fbbf24" text-anchor="middle" font-weight="400">fetch(request)</text><line x1="786" y1="490" x2="484" y2="490" stroke="#34d399" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrow-green)"/><rect x="577.5" y="452" width="115" height="30" fill="#0f172a"/><text x="635.0" y="475" font-size="20" fill="#34d399" text-anchor="middle" font-weight="400">应用 HTML</text><line x1="476" y1="664" x2="165" y2="664" stroke="#fb7185" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrow-rose)"/><rect x="223.0" y="626" width="195" height="30" fill="#0f172a"/><text x="320.5" y="649" font-size="20" fill="#fb7185" text-anchor="middle" font-weight="400">含注入脚本的 HTML</text><rect x="55" y="198" width="220" height="80" rx="10" fill="#0f172a"/><rect x="55" y="198" width="220" height="80" rx="10" fill="#22d3ee" fill-opacity=".10" stroke="#22d3ee" stroke-width="1.6"/><text x="165.0" y="232" font-size="23" fill="#f8fafc" text-anchor="middle" font-weight="600">浏览器</text><text x="165.0" y="260" font-size="16" fill="#22d3ee" text-anchor="middle" font-weight="400">Visitor</text><rect x="350" y="198" width="260" height="80" rx="10" fill="#0f172a"/><rect x="350" y="198" width="260" height="80" rx="10" fill="#fb7185" fill-opacity=".10" stroke="#fb7185" stroke-width="1.6"/><text x="480.0" y="232" font-size="23" fill="#f8fafc" text-anchor="middle" font-weight="600">恶意 Worker</text><text x="480.0" y="260" font-size="16" fill="#fb7185" text-anchor="middle" font-weight="400">*hydroroll.team/*</text><rect x="680" y="198" width="220" height="80" rx="10" fill="#0f172a"/><rect x="680" y="198" width="220" height="80" rx="10" fill="#34d399" fill-opacity=".10" stroke="#34d399" stroke-width="1.6"/><text x="790.0" y="232" font-size="23" fill="#f8fafc" text-anchor="middle" font-weight="600">Cortex Worker</text><text x="790.0" y="260" font-size="16" fill="#34d399" text-anchor="middle" font-weight="400">Custom Domain</text><rect x="350" y="545" width="260" height="76" rx="10" fill="#0f172a"/><rect x="350" y="545" width="260" height="76" rx="10" fill="#fb7185" fill-opacity=".10" stroke="#fb7185" stroke-width="1.6"/><text x="480.0" y="579" font-size="23" fill="#f8fafc" text-anchor="middle" font-weight="600">追加脚本</text><text x="480.0" y="607" font-size="16" fill="#fb7185" text-anchor="middle" font-weight="400">HTMLRewriter</text><text x="40" y="755" font-size="20" fill="#94a3b8" text-anchor="start" font-weight="400">正常部署只更新 Cortex；它不会自动移除前置的恶意路由。</text><text x="40" y="789" font-size="18" fill="#94a3b8" text-anchor="start" font-weight="400">外部载荷分支来自静态分析，本次未执行。</text></svg>